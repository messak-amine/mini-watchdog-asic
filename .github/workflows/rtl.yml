name: RTL checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator yosys
          iverilog -V
          verilator --version
          yosys -V

      - name: Verify Verilog-2001 compatibility
        run: iverilog -g2001 -Wall -s watchdog_scan -tnull rtl/watchdog_scan.v

      - name: Simulate, lint, synthesize, and check the netlist
        run: make sim lint synth gate

      - name: Upload verification results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: watchdog-results
          if-no-files-found: error
          path: |
            build/watchdog.vcd
            build/cell_stats.txt
            build/synthesis.log
            build/watchdog_scan_netlist.v
            build/gate/build/watchdog.vcd
